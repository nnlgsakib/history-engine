[package]
name = "fnf-history"
version = "0.1.0"
edition = "2021"
description = "Transaction history, activity feed and chain discovery for FNF Wallet (persistence + explorer clients, no signing)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite compiled from source so the same build works for the host and all
# four Android ABIs without a system sqlite.
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Chain + token metadata. History resolves symbols and decimals from here
# rather than duplicating chain data.
registry = { version = "0.1.0", path = "../registry" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }